[package]
name = "amber"
version = "0.3.4"
edition = "2021"
authors = ["SVCH <svch@seriousaboutsolutions.co.uk>"]
description = "Autonomous dependency reduction engine for Rust"
license = "MIT"
repository = "https://github.com/elci-group/amber"
keywords = ["dependencies", "cargo", "analysis", "security", "cli"]
rust-version = "1.85"

[lib]
name = "amber"
path = "src/lib.rs"

[[bin]]
name = "amber"
path = "src/main.rs"

[[bench]]
name = "amber_benchmarks"
harness = false

[[bench]]
name = "amber_library"
harness = false
required-features = ["library"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
cargo_metadata = "0.18"
syn = { version = "2.0", features = ["full", "visit"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
toml = "0.8"
toml_edit = { version = "0.22", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
form3 = { path = "../3form" }
ureq = { version = "2.10", optional = true, features = ["json"] }
rustsec = { version = "0.31", default-features = false }
# Git dependency on the public padagonia repository. Once padagonia is
# published to crates.io, switch to `padagonia = { version = "0.1.4", optional = true }`
# (crates.io forbids git dependencies, so this also gates `cargo publish`).
# Note: padagonia's MSRV is 1.85, so the `library` feature requires Rust 1.85+.
padagonia = { git = "https://github.com/elci-group/padagonia", tag = "v0.1.4", optional = true }

[features]
default = []
online = ["dep:ureq"]
library = ["dep:padagonia"]
migrate = ["dep:toml_edit"]
daemon = ["library"]
# Behavioral benchmarking is opt-in because it requires Linux `strace`.
# Its trace classifier is internal, avoiding a network/TUI dependency graph.
jeenome = []

[dev-dependencies]
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
